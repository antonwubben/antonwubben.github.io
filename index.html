<!-- Geen navigatiebalk op de voorpagina: de twee tegels zijn het menu. Alleen de taalkeuze rechtsboven. -->
<label class="lang-switch floating"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>NL</span><select aria-label="Taal"><option value="index.html" data-lang="nl" selected>Nederlands</option><option value="en/index.html" data-lang="en">English</option><option value="de/index.html" data-lang="de">Deutsch</option><option value="es/index.html" data-lang="es">Español</option><option value="fr/index.html" data-lang="fr">Français</option><option value="it/index.html" data-lang="it">Italiano</option><option value="pt/index.html" data-lang="pt">Português</option></select></label>

<main>
  <section class="tiles">
    <a class="tile" href="wie/index.html">
      <div class="icon" aria-hidden="true">
        <img src="wie/anton.jpg" alt="">

<script>
(function () {
  // Bedankje tonen als het contactformulier zojuist is verstuurd (FormSubmit stuurt terug met ?sent=1).
  var sent = document.querySelector('.sent');
  if (sent && /[?&]sent=1/.test(location.search)) { sent.hidden = false; }
  var key = 'lang', sels = document.querySelectorAll('.lang-switch select'), i;
  function go(url, lang) { try { localStorage.setItem(key, lang); } catch (e) {} location.href = url; }
  for (i = 0; i < sels.length; i++) {
    sels[i].addEventListener('change', function () {
      var o = this.options[this.selectedIndex]; go(o.value, o.getAttribute('data-lang'));
    });
  }
  try {
    if (!sels.length || sessionStorage.getItem('langChecked')) return;
    sessionStorage.setItem('langChecked', '1');
    var current = document.documentElement.lang, wanted = localStorage.getItem(key);
    if (!wanted) { wanted = ((navigator.languages && navigator.languages[0]) || navigator.language || '').slice(0, 2).toLowerCase(); }
    if (wanted && wanted !== current) {
      var o = sels[0].querySelector('option[data-lang="' + wanted + '"]');
      if (o) location.replace(o.value);
    }
  } catch (e) {}
})();
</script>
</body>
