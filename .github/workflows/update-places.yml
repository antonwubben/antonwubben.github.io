name: Update Glutenmaps places

on:
  schedule:
    - cron: "17 3 * * *" # dagelijks, 's nachts
  workflow_dispatch: # ook handmatig te starten via het Actions-tabblad

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch places from Overpass
        run: python3 glutenmaps/fetch_places.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain glutenmaps/places-nl.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add glutenmaps/places-nl.json
            git commit -m "Update glutenvrije plekken"
            git push
          fi
