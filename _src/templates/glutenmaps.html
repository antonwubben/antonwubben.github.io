<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{gm_title}}</title>
<meta name="description" content="{{gm_description}}">
<link rel="stylesheet" href="{{root}}style.css">
<link rel="icon" href="{{root}}glutenmaps/icon.png">
{{alternates}}
</head>
<body>

{{nav}}

<main>
  <section class="hero">
    <img class="app-icon" src="{{root}}glutenmaps/icon.png" alt="{{gm_icon_alt}}" width="128" height="128">
    <h1>Glutenmaps</h1>
    <p class="slogan">{{gm_slogan}}</p>
    <p>{{gm_tagline}}</p>

    <div class="actions">
      <!-- Nog zonder link. Zodra de app is goedgekeurd: maak hier een <a class="button primary" href="https://apps.apple.com/..." target="_blank" rel="noopener"> van en vervang de tekst gc_coming_soon. -->
      <span class="button primary static">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C5.9 6.8 4.2 7.8 3.3 9.4c-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.9-.9 3.5-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.6 1-1.5 1.5-3 1.5-3.1-.1 0-3.5-1.3-3.5-4.7zM13.9 5c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>
        {{gc_coming_soon}}
      </span>
      <a class="button secondary" href="{{url_gm_privacy}}">{{gc_privacy_button}}</a>
    </div>
  </section>

  <section class="features">
    <div class="feature">
      <div class="symbol" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      </div>
      <h3>{{gm_f1_h3}}</h3>
      <p>{{gm_f1_p}}</p>
    </div>

    <div class="feature">
      <div class="symbol" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.4 8.4-8 9-4.6-.6-8-4-8-9V7l8-4z"/><path d="M9 12l2 2 4-4"/></svg>
      </div>
      <h3>{{gm_f2_h3}}</h3>
      <p>{{gm_f2_p}}</p>
    </div>

    <div class="feature">
      <div class="symbol" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </div>
      <h3>{{gm_f3_h3}}</h3>
      <p>{{gm_f3_p}}</p>
    </div>
  </section>

  <section class="vision">
    <h2>{{gm_vision_h2}}</h2>
    <p>{{gm_vision_p1}}</p>
    <p>{{gm_vision_p2}}</p>
  </section>
</main>

<footer class="minimal">
  <span>{{copyright}}</span>
</footer>

{{script}}
</body>
</html>
