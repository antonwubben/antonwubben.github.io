<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{home_title}}</title>
<meta name="description" content="{{home_description}}">
<link rel="stylesheet" href="{{root}}style.css">
<link rel="icon" href="{{root}}wie/anton.jpg?v=2">
{{alternates}}
</head>
<body class="home">

{{nav}}

<main>
  <section class="tiles">
    <a class="tile" href="{{url_wie}}">
      <div class="icon" aria-hidden="true">
        <img src="{{root}}wie/anton.jpg" alt="">
      </div>
      <h2>{{home_tile_wie_title}}</h2>
      <p>{{home_tile_wie_text}}</p>
      <span class="more">{{home_tile_wie_more}}</span>
    </a>

    <a class="tile" href="{{url_glutenscan}}">
      <div class="icon" aria-hidden="true">
        <img src="{{root}}glutenscan/icon.png" alt="">
      </div>
      <h2>Glutenscan</h2>
      <p>{{home_tile_gc_text}}</p>
      <span class="more">{{home_tile_gc_more}}</span>
    </a>
  </section>
</main>

<footer class="minimal">
  <span>{{copyright}}</span>
</footer>

{{script}}
</body>
</html>
