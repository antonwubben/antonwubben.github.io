<!DOCTYPE html>
<html lang="{{lang}}">
<head>

<link rel="stylesheet" href="{{root}}style.css">
<link rel="icon" href="{{root}}glutencheck/icon.png">
{{alternates}}
</head>
<body>

{{nav}}

<main>

    <img class="portrait" src="{{root}}wie/anton.jpg" alt="{{wie_portrait_alt}}" width="160" height="160">
    <h1>{{wie_h1}}</h1>
    <p class="meta">{{wie_subtitle}}</p>

    <p>{{wie_p1}}</p>
    <p>{{wie_p2}}</p>
    <p>{{wie_p3}}</p>
    <p>{{wie_p4}}</p>
    <p>{{wie_p5}}</p>

    <div class="actions start">

        {{wie_linkedin}}

    </div>
  </article>
</main>

<footer class="minimal">
  <span>{{copyright}}</span>
</footer>

{{script}}
</body>
</html>
